[package]
name = "gh-star-trend"
version = "0.1.0"
edition = "2024"

[dependencies]
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"

[profile.release]
strip = true
lto = true
